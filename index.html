<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b83256">
<title>For Affiee</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="extras.css">
</head>
<body>

<div class="gate" id="gate">
  <div>
    <p class="beat" aria-hidden="true">♥</p>
    <h1 id="gateTitle"></h1>
    <p>Something small, made just for you.</p>
    <button id="open">Tap to open</button>
  </div>
</div>

<main>
  <header class="hero">
    <p class="to" id="toLine"></p>
    <p class="count" id="days">0</p>
    <h1 id="headline"></h1>
    <p class="sub" id="subline"></p>
    <p class="months" id="months"></p>
    <p class="clock" id="clock"></p>
  </header>

  <section>
    <h2>Our Story So Far</h2>
    <div class="rail" id="timeline"></div>
  </section>

  <section>
    <h2>Reasons I Love You</h2>
    <div class="reason" id="reason" aria-live="polite"></div>
    <button id="next">Show me another</button><span class="meta" id="reasonCount"></span>
  </section>

  <section>
    <h2>Open When...</h2>
    <div class="envs" id="envs"></div>
  </section>

  <section>
    <h2>Us</h2>
    <div class="photos" id="photos"></div>
  </section>

  <section>
    <div class="letter">
      <h2>Note For You</h2>
      <div id="letter"></div>
      <p class="sign" id="sign"></p>
    </div>
  </section>
</main>

<div class="lb" id="lb" role="dialog" aria-label="Photo viewer">
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</div>

<div class="note" id="note" role="dialog" aria-label="Message">
  <div class="paper">
    <h3 id="noteTitle"></h3>
    <p id="noteText"></p>
    <small>tap anywhere to close</small>
  </div>
</div>

<button class="mute" id="mute" hidden aria-label="Play or pause music">♪</button>
<audio id="music" loop></audio>

<script src="script.js"></script>
<script src="extras.js"></script>
</body>
</html>
