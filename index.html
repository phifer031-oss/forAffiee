<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FOR AFFIEE</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>

            <header class="hero">
                <p class="to" id="toLine"></p>
                <p class="count" id="days"></p>
                <h1 id="headline"></h1>
                <p class="sub" id="subline"></p>
                <p class="clock" id="clock"></p>
            </header>

            <section>
                <h2>Our Story So Far</h2>
                <div class="rail" id="timeline"></div>
            </section>

            <section>
                <h2>Reasons I Love You</h2>
                <div class="reason" id="reason" aria-live="polite"></div>
                <button id="next">Show me another</button><span class="meta" id="reasonCount"></span>
            </section>

            <section>
                <h2>Us</h2>
                <div class="photos" id="photos"></div>
            </section>

            <section>
                <div class="letter">
                    <h2>Note For You</h2>
                    <div id="letter"></div>
                    <p class="sign" id="sign"></p>
                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
