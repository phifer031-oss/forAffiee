<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b83256">
<title>For Affiee</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gate" id="gate">
  <div>
    <p class="beat" aria-hidden="true">♥</p>
    <h1 id="gateTitle"></h1>
    <p>Something small, made just for you.</p>
    <button id="open">Tap to open</button>
  </div>
</div>

<main>
  <p class="banner" id="banner" hidden></p>
  <header class="hero">
    <p class="to" id="toLine"></p>
    <p class="count" id="days">0</p>
    <h1 id="headline"></h1>
    <p class="sub" id="subline"></p>
    <p class="months" id="months"></p>
    <p class="clock" id="clock"></p>
  </header>

  <section>
    <h2>Our Story So Far</h2>
    <div class="rail" id="timeline"></div>
  </section>

  <section>
    <h2>Reasons I Love You</h2>
    <div class="reason" id="reason" aria-live="polite"></div>
    <button id="next">Show me another</button><span class="meta" id="reasonCount"></span>
  </section>

  <section>
    <h2>Our Song</h2>
    <div class="player" id="player">
      <div class="pl-top"><span>NOW PLAYING</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></div>
      <div class="pl-main">
        <img class="cover" id="plCover" alt="Album cover">
        <div><p class="pl-title" id="plTitle"></p><p class="pl-artist" id="plArtist"></p></div>
      </div>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <button class="play" id="playBtn" aria-label="Play or pause">&#9654;</button>
    </div>
  </section>

  <section>
    <h2>Open When...</h2>
    <div id="openWhen"></div>
  </section>

  <section>
    <h2>Our Bucket List</h2>
    <p class="meta2" id="bucketCount"></p>
    <ul class="bucket" id="bucket"></ul>
  </section>

  <section>
    <h2>Us</h2>
    <div class="photos" id="photos"></div>
  </section>

  <section>
    <div class="letter">
      <h2>Note For You</h2>
      <div id="letter"></div>
      <p class="sign" id="sign"></p>
    </div>
  </section>
</main>

<div class="lb" id="lb" role="dialog" aria-label="Photo viewer">
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</div>

<audio id="music" loop preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
